<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Slot Machine</title>
</head>
<body>
    <section class="slot-machine-container">
        <div id="money-display"></div>

         <div class="bet-controls">
           
            <button class="bet-btn" id="betMin">MIN</button>
            <button class="bet-btn" id="betMax">MAX</button>
            <!-- <button class="bet-btn reset-btn" id="resetGame">🔄 Reset</button> -->
        </div>
        
        <div class="slot-machine">
          
            <p class="reel" id="reel1"></p>
            <p class="reel" id="reel2"></p>
            <p class="reel" id="reel3"></p>      
        </div>
      <div id="message"></div>

     
     
    </section>
     <script src="js/main.js"></script>
</body>
</html>
